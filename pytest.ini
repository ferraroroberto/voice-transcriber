[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
markers =
    smoke: end-to-end webapp boot tests (slow; require free port 8443)
    network: tests that hit local-llm-hub on :8000 (skipped if unreachable)
