<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whisper">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/icon-512.png">
  <link rel="stylesheet" href="/static/styles.css?v=__STYLES_CSS__">
  <title>🎙️ Whisper</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>🎙️ Whisper</h1>
      <div class="header-actions">
        <label class="append-toggle" title="Append the next take to the current transcript instead of replacing it">
          <input id="appendToggle" type="checkbox" hidden>
          <span>➕ Append</span>
        </label>
        <button id="resetBtn" type="button" class="header-icon-btn" title="Reset — clear both boxes and the current session" aria-label="Reset">🧽</button>
        <label class="incognito-btn" title="Incognito — don't save this recording to history">
          <input id="incognitoToggle" type="checkbox" hidden>
          <span class="icon">🕵️</span>
        </label>
      </div>
    </header>

    <section id="recordZone" class="record-zone">
      <button id="recordBtn" type="button" class="record-btn" aria-pressed="false">
        <span id="recordLabel" class="record-label">⬤ RECORD</span>
        <span id="recordTimer" class="record-timer" hidden>00:00</span>
      </button>
      <button id="resumeBtn" type="button" class="resume-btn" title="Resume — continue this transcript with a new take" aria-label="Resume recording" hidden>▶</button>
      <div id="recordStatus" class="record-status">Tap to start</div>
      <div id="levelBar" class="level-bar"><div id="levelFill" class="level-fill"></div></div>
    </section>

    <section class="card transcript-card">
      <div class="card-header">
        <h2>🎙️ Transcript</h2>
        <div class="row card-header-actions">
          <button id="saveTranscript" class="copy-btn" type="button" title="Save the pasted text to history without polishing" disabled>💾 Save</button>
          <button id="copyTranscript" class="copy-btn" type="button" disabled>📋 Copy</button>
        </div>
      </div>
      <textarea id="transcript" class="text-out editable" placeholder="Your dictation will appear here — or paste text here and tap Save / Go" rows="4"></textarea>
    </section>

    <section class="card polish-card">
      <div class="card-header">
        <h2>✨ Polish</h2>
        <div class="row card-header-actions">
          <button id="polishBtn" class="big-btn polish-btn" type="button" disabled>Go</button>
          <button id="copyPolished" class="copy-btn" type="button" disabled>📋 Copy</button>
        </div>
      </div>
      <textarea id="polished" class="text-out editable" placeholder="Polished text will appear here — you can edit before copying" rows="3"></textarea>
    </section>

    <details id="settingsPanel" class="card settings-card">
      <summary>⚙️ Settings</summary>
      <label class="row">
        <span>Polish model</span>
        <select id="polishModel" class="select-native"></select>
      </label>
      <label class="row">
        <span>Polish style</span>
        <select id="polishStyle" class="select-native"></select>
      </label>
      <label class="stacked">
        <span class="muted small">Prompt sent to the LLM (read-only preview)</span>
        <textarea id="polishPromptPreview" class="text-out prompt-preview" rows="6" readonly></textarea>
      </label>
      <hr>
      <label class="row">
        <span>Language</span>
        <select id="languageSelect" class="select-native"></select>
      </label>
      <label class="row toggle" title="Speak in the selected language above; whisper outputs English. Routes through the local-llm-hub's :8091 translate-capable model — first call after idle has a 3–8 s cold start.">
        <span>🌐 Translate to English</span>
        <input id="translateToggle" type="checkbox">
      </label>
      <label class="row">
        <span>Microphone</span>
        <select id="micSelect" class="select-native"></select>
      </label>
      <label class="row toggle">
        <span>Force built-in mic (skip Bluetooth)</span>
        <input id="forceBuiltinMic" type="checkbox">
      </label>
      <label class="row toggle" title="Amplify captured audio before it reaches whisper — for a quiet mic or a quiet room. Distinct from the silence-skip anti-hallucination gate below.">
        <span>🔊 Quiet-environment gain boost</span>
        <input id="gainBoostToggle" type="checkbox">
      </label>
      <label class="row">
        <span>Boost amount (dB)</span>
        <input id="gainBoostDb" type="number" min="0" max="24" step="1" class="input-native">
      </label>
      <label class="row toggle" title="After this many ms of continuous near-silence, auto-fire Stop. A 500 ms 'keep talking to cancel' banner appears first.">
        <span>🤖 Auto-stop on silence</span>
        <input id="vadAutoStopToggle" type="checkbox">
      </label>
      <label class="row">
        <span>Silence duration (ms)</span>
        <input id="autoStopSilenceMs" type="number" min="200" max="10000" step="100" class="input-native">
      </label>
      <label class="row">
        <span>Auto-clean older than (days)</span>
        <input id="retentionDays" type="number" min="1" max="365" class="input-native">
      </label>
      <div class="row">
        <button id="saveSettings" type="button" class="big-btn">💾 Save</button>
      </div>
      <hr>
      <p class="muted small">
        First time on iPhone? Install the trust profile:
        <a href="/install-ca">/install-ca</a>
      </p>
      <p id="statusReadout" class="muted small"></p>
      <p id="buildInfo" class="muted small" title="Which build of the webapp this device loaded — see issue #13">Build: …</p>
    </details>

    <details class="card history-card" open>
      <summary>📜 History (<span id="historyCount">0</span>)</summary>
      <div class="history-actions">
        <button id="refreshHistory" type="button" class="ghost-btn">🔄 Refresh</button>
        <button id="copySelection" type="button" class="ghost-btn">📋 Copy selected</button>
        <button id="cleanAll" type="button" class="ghost-btn">🗑️ Clean</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <button id="loadMoreHistory" type="button" class="ghost-btn load-more-btn" hidden>📥 Load more</button>
    </details>

    <div id="toast" class="toast" hidden></div>
  </main>

  <div id="loginOverlay" class="login-overlay" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <h2>🔐 Sign in</h2>
      <p class="muted small">Enter the password to use this voice transcriber.</p>
      <input
        id="loginPassword"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        placeholder="Password"
        required
      >
      <button type="submit" class="big-btn">Unlock</button>
      <div id="loginError" class="login-error" hidden></div>
    </form>
  </div>

  <script type="module" src="/static/app.js?v=__APP_JS__"></script>
</body>
</html>
