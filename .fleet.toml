# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py through
# scripts/static_ratchet_gate.py: a duplicate block (jscpd via npx, Python and JS) or an
# unused import/variable (ruff F401,F841), bugbear (B) or security (S, S113 strict) finding that
# is not in .static-ratchet-baseline.json fails.
# Needs Node and ruff in the gate's venv; a detector that cannot run exits 3, which fails
# the gate. Vendored copies are duplicates by design, so they are excluded. Procedure +
# limits: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet for the docs convention. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py: README.md may not grow past 40 KiB (or past its baselined
# size), and README.md / docs/**/*.md may not gain a history marker (an issue reference, a
# dated heading, a changelog heading) beyond .docs-ratchet-baseline.json. Docs state the
# present-tense why; history lives in git, PRs and issues. Every dest in [vendored] is
# already out of scope, so no exclude is needed. Stdlib-only, whole tree, never path-routed.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet on repo structure. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py: it fails when a
# file passes 1,000 lines, a Python/JS function 100 lines, a directory 40 modules, or a
# src/ module imports app/, beyond .structure-ratchet-baseline.json, or when a tracked
# root folder is outside the `shape` preset and `extra_roots` above (never baselined;
# docs/layout.md says why each exception stays). Stdlib only. A file that cannot be
# measured exits 3, which fails the gate. Vendored copies are excluded by the script
# itself. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet for fleet conventions held as
# stdlib `ast` rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py: a rule's hit count in a file may not rise above
# .conventions-ratchet-baseline.json. no-window: this app spawns whisper-server, ffmpeg and
# the tunnel on Windows. logging-not-print: app/ and src/ are library code. no-drive-path:
# paths come from config, never a literal drive. secret-compare and git-wrapper stay off
# because the repo has no constant-time-compare or git-spawn helper to route through.
# Exit 3 (a file could not be parsed) fails the gate as NOT CONFIRMED. Whole tree, never
# path-routed. Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet for issue references in
# product-code comments. The gate (scripts/verify-before-ship.ps1) runs
# scripts/comment_ratchet.py through scripts/comment_ratchet_gate.py: a file's count of
# `#NNN` references in .py/.js/.css/.ps1 comments may not rise above
# .comment-ratchet-baseline.json. A comment states the present-tense why; how the code got
# there lives in the issue, the PR and git log. Tests and every [vendored] dest are out of
# scope automatically; _vendored/ holds scaffold copies the repo does not edit. Exit 3 (a file could not be scanned) fails the gate as NOT
# CONFIRMED. Whole tree, never path-routed. Procedure + limits: project-scaffolding
# docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet for the deterministic rules
# of the fleet's prompt audit over this repo's instruction files (CLAUDE.md and AGENTS.md;
# the repo ships no skills). The gate (scripts/verify-before-ship.ps1) runs
# scripts/instruction_ratchet.py through scripts/instruction_ratchet_gate.py: a rule's
# violation count in a file may not rise above .instruction-ratchet-baseline.json, and a
# file may not pass its size cap. Exit 3 (a file could not be read, or a fence never
# closes) fails the gate as NOT CONFIRMED. Whole tree, never path-routed. Procedure +
# limits: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet for references in the docs. The
# gate (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py through
# scripts/doc_refs_ratchet_gate.py: a repo path, `python -m` module, relative link or
# loopback port named in README.md, CLAUDE.md or docs/**/*.md that no longer resolves
# against the tracked tree and `port` above fails unless .doc-refs-ratchet-baseline.json
# records it. allow_refs lists the other services' ports the docs name: the hub (:8000),
# whisper-server (:8090), the translate server (:8091) and the iPhone DevTools proxy
# (:9221), none of them this app's `port`. Exit 3 (git
# unusable, a file that is not UTF-8, an unclosed fence) fails the gate as NOT CONFIRMED.
# Whole tree, never path-routed. Procedure + limits: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
allow_refs = [":8000", ":8090", ":8091", ":9221"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet for definitions nothing
# references. The gate (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py
# through scripts/dead_code_ratchet_gate.py: a function, class or method that no tracked
# Python file reads by name (tests included) fails unless .dead-code-ratchet-baseline.json
# records it. Entry points a framework calls (routes, dunders, test hooks) are built in;
# `allow` and `entry_decorators` below cover this repo's own. Vendored copies are read for
# references, never reported. Exit 3 (git unusable, a .py file that does not parse) fails
# the gate as NOT CONFIRMED. Whole tree, never path-routed. Procedure + limits:
# project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; first match wins. Unmatched paths fall
# through to `full` by design — see the doc before narrowing this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
junit_xml             = ".pytest_cache/e2e-junit.xml"

[[e2e.rule]]              # inert assets under the webapp static tree -> static
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "ico", "woff2", "webmanifest"]

[[e2e.rule]]             # vendored component READMEs are docs, never served -> none (#216)
tier       = "none"
prefix     = "app/webapp/static/_vendored/"
extensions = ["md"]

[[e2e.rule]]             # the webapp (routers + static css/js/html) -> full
tier   = "full"
prefix = "app/webapp/"

[[e2e.rule]]             # tray/gui, cli, and shared logic -> no browser impact -> none
tier       = "none"
prefix     = "app/gui/"
extensions = ["py"]

[[e2e.rule]]             # cli entry points -> no browser impact -> none
tier       = "none"
prefix     = "app/cli/"
extensions = ["py"]

[[e2e.rule]]             # shared logic layer -> no browser impact -> none
tier       = "none"
prefix     = "src/"
extensions = ["py"]

[[e2e.rule]]             # the e2e suite itself + its boot conftest -> full
tier       = "full"
prefix     = "tests/e2e/"

[[e2e.rule]]             # unit/integration tests (not the e2e suite itself) -> none
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

[[e2e.rule]]             # tooling scripts (incl. this classifier) -> none
tier       = "none"
prefix     = "scripts/"

[[e2e.rule]]             # docs -> none
tier       = "none"
prefix     = "docs/"

[[e2e.rule]]             # markdown anywhere -> none
tier       = "none"
extensions = ["md"]

[[e2e.rule]]             # this file itself -> none
tier = "none"
path = ".fleet.toml"

# Launchers and repo-hygiene files never reach the browser suite (#211): the
# e2e conftest spawns `python -m uvicorn app.webapp.server:app` itself and
# never runs a .bat. Kept below the `app/webapp/` and `tests/e2e/` rules so a
# .bat under either still routes full. `config/webapp_config.sample.json`
# (seeded into the e2e run) and `.github/workflows/e2e.yml` (defines it) stay
# unmatched on purpose -> full.
[[e2e.rule]]             # launcher scripts (tray.bat, webapp.bat, ...) -> none
tier       = "none"
extensions = ["bat"]

[[e2e.rule]]             # git ignore list -> none
tier = "none"
path = ".gitignore"

[[e2e.rule]]             # static-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".static-ratchet-baseline.json"

[[e2e.rule]]             # docs-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".docs-ratchet-baseline.json"

[[e2e.rule]]             # structure-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".structure-ratchet-baseline.json"

[[e2e.rule]]             # conventions-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".conventions-ratchet-baseline.json"

[[e2e.rule]]             # comment-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".comment-ratchet-baseline.json"

[[e2e.rule]]             # instruction-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".instruction-ratchet-baseline.json"

[[e2e.rule]]             # doc-refs-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".doc-refs-ratchet-baseline.json"

[[e2e.rule]]             # dead-code-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".dead-code-ratchet-baseline.json"

[[e2e.rule]]             # sample config the e2e run never reads -> none
tier = "none"
path = "config/disfluencies.sample.json"

# /design-review (fleet-config skills/design-review). The app stamps html[data-theme]
# at load from voice-transcriber.theme (else the OS scheme), so the e2e capture hook
# (tests/e2e/_surface.py) has to set that key too or its dark shots stay light (#297).
[design.review]
theme_storage_key = "voice-transcriber.theme"

# The throwaway instance `measure --e2e` walks: the e2e suite's own disposable
# webapp on a free loopback port with every runtime-data path in a temp dir, never
# the live tray on :8443 (#297).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 90

# `measure --e2e` runs the suite with the surface() hook armed. A bare run would meet
# the live-tray guard (it refuses while :8443 is occupied), so autoboot is explicit.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 900
