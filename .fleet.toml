# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🎙️"
port        = ":8443"
description = "Always-on voice→text (F8). Owns whisper :8090."
chips       = ["whisper :8090"]
depends_on  = ["local-llm-hub"]
shape       = "webapp-tray"
extra_roots = []

# Design-lint findings examined and accepted (schema: fleet-config's
# architecture/README.md, "[[design.accepted]]"). `detail` is the finding's
# exact string.
# The record circle is Record's one primary action (design.md glance card:
# "the tab's one primary (Record)"), so its solid accent at rest is the
# primary tier, not a stray. The owner chose accent at rest, red only while
# the mic is live (#260, decision 1).
[[design.accepted]]
check  = "button-tiers"
detail = "solid accent fill outside the primary: .record-btn"
reason = "the record circle is the Record tab's one primary action"
record = "https://github.com/ferraroroberto/voice-transcriber/issues/262"

# cert-drift triage verdict (schema: fleet-config's architecture/README.md,
# "[cert]"). The self-signed cert exists for the loopback secure context
# (getUserMedia); remote access is Cloudflare-only, so tailscale cert is out of scope.
[cert]
not_applicable = true
reason         = "the self-signed cert serves loopback SANs for getUserMedia, which a tailscale cert leaf cannot; remote access is Cloudflare-only"
disproof       = "https://github.com/ferraroroberto/voice-transcriber/issues/151"

# The clone-and-setup installer (src/installer.py, run by setup.bat; docs/install.md).
# Only config/webapp_config.json is topped up with new keys: it is the one config
# the app rewrites. The four companion lists are the owner's own and are created
# from their samples when missing, never rewritten. config/config.json,
# polish_prompts.json and whisper_server.yaml are tracked, so they are not targets.
# webapp/cloudflared.yml is deliberately no target: its sample holds a placeholder
# tunnel, which the tray would try to run. It is the owner's own file (docs/install.md).
[install]
requirements = "requirements.txt"
samples      = ["config"]
settings     = ["config/webapp_config.json"]

# Fetches whisper.cpp and the ggml model into vendor/; the script returns at once
# when both are there. It reruns when it or the server config (model path) changes.
[install.deps]
command = ["{python}", "scripts/setup_assets.py"]
inputs  = ["config/whisper_server.yaml", "scripts/setup_assets.py"]

# The status probe reads the stored hash, not just the file: exit 0 stored, 1 none or unusable, 2 unreadable.
# --legacy counts the old plaintext value the login route still honours. It runs as a file, not
# `-m`: that imports the src package first, whose missing dependency would exit 1 and read as no password.
[[install.check]]
name    = "Sign-in password"
command = ["{python}", "src/password.py", "status", "--legacy", "config/webapp_config.json", "auth_password"]
hint    = "set one with: .venv\\Scripts\\python.exe -m src.password set"

[[install.check]]
name  = "HTTPS certificate"
paths = ["webapp/certificates/cert.pem", "webapp/certificates/key.pem"]
hint  = "run: .venv\\Scripts\\python.exe scripts\\gen_ssl_cert.py"

[[install.check]]
name  = "whisper.cpp server"
paths = ["vendor/whisper.cpp/whisper-server.exe"]
hint  = "run: .venv\\Scripts\\python.exe scripts\\setup_assets.py"

[[install.check]]
name  = "ggml model"
paths = ["vendor/whisper.cpp/models/ggml-large-v3-turbo.bin"]
hint  = "run: .venv\\Scripts\\python.exe scripts\\setup_assets.py"

