# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🎙️"
port        = ":8443"
description = "Always-on voice→text (F8). Owns whisper :8090."
chips       = ["whisper :8090"]
shape       = "webapp-tray"
extra_roots = ["webapp"]

# Design-lint findings examined and accepted (schema: fleet-config's
# architecture/README.md, "[[design.accepted]]"). `detail` is the finding's
# exact string, so it goes stale if the dialog moves off index.html:466.
# In effect since fleet-config#953: design_lint's modal-header row carries
# evidence (index.html:466), so this entry matches it and the FAIL reports
# ACCEPTED.
[[design.accepted]]
check  = "modal-header"
target = "app/webapp/static/index.html"
detail = "editor-modal header contract violated (design.md modal wants a heading-lg title + square x close, never a footer Cancel): app/webapp/static/index.html:466 no square x close button"
reason = "#loginOverlay is a non-dismissable auth gate: a x close would be a no-op or a way past authentication"
record = "https://github.com/ferraroroberto/voice-transcriber/issues/202"

# The record circle is Record's one primary action (design.md glance card:
# "the tab's one primary (Record)"), so its solid accent at rest is the
# primary tier, not a stray. The owner chose accent at rest, red only while
# the mic is live (#260, decision 1).
[[design.accepted]]
check  = "button-tiers"
detail = "solid accent fill outside the primary: .record-btn"
reason = "the record circle is the Record tab's one primary action"
record = "https://github.com/ferraroroberto/voice-transcriber/issues/262"

