# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🎙️"
port        = ":8443"
description = "Always-on voice→text (F8). Owns whisper :8090."
chips       = ["whisper :8090"]

# Design-lint findings examined and accepted (schema: fleet-config's
# architecture/README.md, "[[design.accepted]]"). `detail` is the finding's
# exact string, so it goes stale if the dialog moves off index.html:339.
# In effect since fleet-config#953: design_lint's modal-header row carries
# evidence (index.html:339), so this entry matches it and the FAIL reports
# ACCEPTED.
[[design.accepted]]
check  = "modal-header"
target = "app/webapp/static/index.html"
detail = "editor-modal header contract violated (design.md modal wants a heading-lg title + square x close, never a footer Cancel): app/webapp/static/index.html:339 no square x close button"
reason = "#loginOverlay is a non-dismissable auth gate: a x close would be a no-op or a way past authentication"
record = "https://github.com/ferraroroberto/voice-transcriber/issues/202"

[vendored]
e2e_live_guard = { src = "tests/e2e/_e2e_live_guard.py", sha = "727dfe8b9e4e625993c0e0286836e510015411cc", dest = "tests/e2e/_e2e_live_guard.py" }
runtime_data = { src = "src/runtime_data.py", sha = "346765f7c14af0ec61e960333c055974e4e9e1db", dest = "src/runtime_data.py" }
classify_e2e = { src = "scripts/classify_e2e.py", sha = "bede95f00aee0b17d5007246a29fa881a71f24f4", dest = "scripts/classify_e2e.py" }

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; first match wins. Unmatched paths fall
# through to `full` by design — see the doc before narrowing this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"

[[e2e.rule]]              # inert assets under the webapp static tree -> static
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "ico", "woff2", "webmanifest"]

[[e2e.rule]]             # the webapp (routers + static css/js/html) -> full
tier   = "full"
prefix = "app/webapp/"

[[e2e.rule]]             # tray/gui, cli, and shared logic -> no browser impact -> none
tier       = "none"
prefix     = "app/gui/"
extensions = ["py"]

[[e2e.rule]]             # cli entry points -> no browser impact -> none
tier       = "none"
prefix     = "app/cli/"
extensions = ["py"]

[[e2e.rule]]             # shared logic layer -> no browser impact -> none
tier       = "none"
prefix     = "src/"
extensions = ["py"]

[[e2e.rule]]             # the e2e suite itself + its boot conftest -> full
tier       = "full"
prefix     = "tests/e2e/"

[[e2e.rule]]             # unit/integration tests (not the e2e suite itself) -> none
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

[[e2e.rule]]             # tooling scripts (incl. this classifier) -> none
tier       = "none"
prefix     = "scripts/"

[[e2e.rule]]             # docs -> none
tier       = "none"
prefix     = "docs/"

[[e2e.rule]]             # markdown anywhere -> none
tier       = "none"
extensions = ["md"]

[[e2e.rule]]             # this file itself -> none
tier = "none"
path = ".fleet.toml"
