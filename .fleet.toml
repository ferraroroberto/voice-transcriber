# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py through
# scripts/static_ratchet_gate.py: a duplicate block (jscpd via npx, Python and JS) or an
# unused import/variable (ruff F401,F841), bugbear (B) or security (S, S113 strict) finding that
# is not in .static-ratchet-baseline.json fails.
# Needs Node and ruff in the gate's venv; a detector that cannot run exits 3, which fails
# the gate. Vendored copies are duplicates by design, so they are excluded. Procedure +
# limits: project-scaffolding docs/static-ratchet.md.
self_restart = { src = "src/self_restart.py", sha = "48602060fffdacbcdcdde66b9886c6471d835ff3", dest = "src/self_restart.py" }
build_info = { src = "src/build_info.py", sha = "1c1007fcd0b65b54342779250cb66975d57482e8", dest = "src/build_info.py" }
health_routes = { src = "src/health_routes.py", sha = "732c304a4735d4e654f5acb3b6f53b7db67d47ef", dest = "src/health_routes.py" }
restart_check = { src = "src/restart_check.py", sha = "f8c2f66eae7a69f3c834386579702ed5b747d7af", dest = "src/restart_check.py" }
ratchet_baseline = { src = "scripts/ratchet_baseline.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/ratchet_baseline.py" }
installer = { src = "src/installer.py", sha = "bafa9446b907dcb7fc6d833c1edfb1a069b7ca38", dest = "src/installer.py" }

[static_ratchet]
enabled  = true
baseline = ".ratchets/static.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet for the docs convention. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py: README.md may not grow past 40 KiB (or past its baselined
# size), and README.md / docs/**/*.md may not gain a history marker (an issue reference, a
# dated heading, a changelog heading) beyond .docs-ratchet-baseline.json. Docs state the
# present-tense why; history lives in git, PRs and issues. Every dest in [vendored] is
# already out of scope, so no exclude is needed. Stdlib-only, whole tree, never path-routed.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".ratchets/docs.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet on repo structure. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py: it fails when a
# file passes 1,000 lines, a Python/JS function 100 lines, a directory 40 modules, or a
# src/ module imports app/, beyond .structure-ratchet-baseline.json, or when a tracked
# root folder is outside the `shape` preset and `extra_roots` above (never baselined;
# docs/layout.md says why each exception stays). Stdlib only. A file that cannot be
# measured exits 3, which fails the gate. Vendored copies are excluded by the script
# itself. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".ratchets/structure.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet for fleet conventions held as
# stdlib `ast` rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py: a rule's hit count in a file may not rise above
# .conventions-ratchet-baseline.json. no-window: this app spawns whisper-server, ffmpeg and
# the tunnel on Windows. logging-not-print: app/ and src/ are library code. no-drive-path:
# paths come from config, never a literal drive. password-input-vendored: a password input
# lives only in the vendored sign-in sheet. login-lockout: the password route goes through
# the vendored src/login_lockout.py. secret-compare and git-wrapper stay off
# because the repo has no constant-time-compare or git-spawn helper to route through.
# Exit 3 (a file could not be parsed) fails the gate as NOT CONFIRMED. Whole tree, never
# path-routed. Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".ratchets/conventions.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "password-input-vendored", "nav-standalone-head", "login-lockout", "subprocess-timeout", "browser-per-iteration", "state-literal", "state-set-repeat", "state-write", "path-sep"]

# Outbound HTTP goes through the pooled session, not a bare requests call.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/pooled_http.py"]
why    = "CLAUDE.md: outbound-connection discipline, one pooled session"
paths  = ["app/", "src/"]

# The one module that opens a SQLite connection; it refuses a path under a code folder.
[[conventions_ratchet.must_use]]
call   = ["sqlite3.connect"]
helper = ["src/runtime_files.py"]
why    = "runtime databases open through the guarded writer, which refuses a code-folder path"
paths  = ["app/", "src/"]

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".ratchets/usage-track.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired", "health-routes-wired"]

# [ux_surface_ratchet] -- scripts/ux_surface_ratchet.py (with its readers scripts/usage_track_scan.py
# and scripts/ux_surface_map.py) fails when the web app's HTML or JS gains a surface root (a <dialog>,
# a dialog/menu/tabpanel role, a popover) with no constant `data-surface` id, an id with no entry in
# docs/ux-surfaces.yaml, a map entry no element carries, one id on two surfaces, a link to an id with
# no entry, or a docs/ux-surface-map.md page not regenerated from the map, beyond
# .ux-surface-ratchet-baseline.json. Exit 3 is "not confirmed", never clean. Mechanism:
# project-scaffolding docs/ux-surface-ratchet.md.
[ux_surface_ratchet]
enabled  = true
baseline = ".ratchets/ux-surface.json"
map      = "docs/ux-surfaces.yaml"
paths    = ["app/webapp/static/**"]

# [request_budget_ratchet] -- scripts/request_budget_ratchet.py (with its reader
# scripts/request_budget_scan.py) fails when a file's count of request-budget hits rises above
# .request-budget-ratchet-baseline.json: a fixed-rate browser poll that reaches the server,
# a poll under 2 s, an unwatched server loop, a directory scan in a request handler, work
# on the event loop's default pool, an app without the timing middleware. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/request-budget-ratchet.md; the
# rules and why: docs/polling-budget.md.
[request_budget_ratchet]
enabled      = true
baseline     = ".ratchets/request-budget.json"
handler_dirs = ["app/webapp/routers"]

# Server loops that run on purpose under 5 s. Each runs only while its job is
# live (a take recording, a server starting), and its cadence is the product.
[[request_budget.loops]]
path       = "src/recorder.py"
function   = "AudioRecorder._capture"
interval_s = 0.05
why        = "checks the stop event and reports the mic level while one take records; 50 ms is how fast a hotkey stop takes effect"

[[request_budget.loops]]
path       = "app/webapp/partial_worker.py"
function   = "PartialWorker._run"
interval_s = 2
why        = "parks on the take's dirty event and sleeps only to debounce new chunks into one partial pass; the interval is the partial-transcript setting and the worker reaps itself when the take goes quiet"

[[request_budget.loops]]
path       = "src/process_supervisor.py"
function   = "wait_until_ready"
interval_s = 0.4
why        = "polls a server it just started until it answers or its deadline passes; runs once per start, never after"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet for issue references in
# product-code comments. The gate (scripts/verify-before-ship.ps1) runs
# scripts/comment_ratchet.py through scripts/comment_ratchet_gate.py: a file's count of
# `#NNN` references in .py/.js/.css/.ps1 comments may not rise above
# .comment-ratchet-baseline.json. A comment states the present-tense why; how the code got
# there lives in the issue, the PR and git log. Tests and every [vendored] dest are out of
# scope automatically; _vendored/ holds scaffold copies the repo does not edit. Exit 3 (a file could not be scanned) fails the gate as NOT
# CONFIRMED. Whole tree, never path-routed. Procedure + limits: project-scaffolding
# docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".ratchets/comment.json"
exclude  = ["**/_vendored/**"]
docstrings      = true
history_phrases = true

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet for the deterministic rules
# of the fleet's prompt audit over this repo's instruction files (CLAUDE.md and AGENTS.md;
# the repo ships no skills). The gate (scripts/verify-before-ship.ps1) runs
# scripts/instruction_ratchet.py through scripts/instruction_ratchet_gate.py: a rule's
# violation count in a file may not rise above .instruction-ratchet-baseline.json, and a
# file may not pass its size cap. Exit 3 (a file could not be read, or a fence never
# closes) fails the gate as NOT CONFIRMED. Whole tree, never path-routed. Procedure +
# limits: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".ratchets/instruction.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet for references in the docs. The
# gate (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py through
# scripts/doc_refs_ratchet_gate.py: a repo path, `python -m` module, relative link or
# loopback port named in README.md, CLAUDE.md or docs/**/*.md that no longer resolves
# against the tracked tree and `port` above fails unless .doc-refs-ratchet-baseline.json
# records it. allow_refs lists the other services' ports the docs name: the hub (:8000),
# whisper-server (:8090), the translate server (:8091) and the iPhone DevTools proxy
# (:9221), none of them this app's `port`. Exit 3 (git
# unusable, a file that is not UTF-8, an unclosed fence) fails the gate as NOT CONFIRMED.
# Whole tree, never path-routed. Procedure + limits: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
trees    = true
baseline = ".ratchets/doc-refs.json"
allow_refs = [":8000", ":8090", ":8091", ":9221"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet for definitions nothing
# references. The gate (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py
# through scripts/dead_code_ratchet_gate.py: a function, class or method that no tracked
# Python file reads by name (tests included) fails unless .dead-code-ratchet-baseline.json
# records it. Entry points a framework calls (routes, dunders, test hooks) are built in;
# `allow` and `entry_decorators` below cover this repo's own. Vendored copies are read for
# references, never reported. Exit 3 (git unusable, a .py file that does not parse) fails
# the gate as NOT CONFIRMED. Whole tree, never path-routed. Procedure + limits:
# project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".ratchets/dead-code.json"

# [windows_only_ratchet] -- the scaffold's baseline-and-ratchet for the Mac nightly's
# `windows_only` convention. The gate (scripts/verify-before-ship.ps1) runs
# scripts/windows_only_ratchet.py: a test that touches a Windows-only module or API (or
# plants a Windows install under a Windows-only variable) without the marker, a skipif on
# the platform or a platform guard fails when its file's count rises above
# .windows-only-ratchet-baseline.json. Exit 3 (a test module cannot be read or parsed)
# fails the gate. Stdlib only, whole tree, never path-routed. Procedure + limits:
# project-scaffolding docs/windows-only-ratchet.md.
[windows_only_ratchet]
enabled  = true
baseline = ".ratchets/windows-only.json"

# [ci.nightly] -- the Mac Mini nightly's settings for this repo (project-scaffolding
# docs/mac-runner.md, "The [ci.nightly] table"). `samples` seeds the gitignored
# config/webapp_config.json the e2e fixtures need from its committed twin. The unit leg
# skips `windows_only` tests; none carry the marker because every Windows-bound test
# already skips itself off win32. `views` boots the throwaway instance declared in
# [design.review.synthetic] for the iPhone-simulator smoke.
[ci.nightly]
python       = "3.12"
requirements = ["requirements.txt", "requirements-dev.txt"]
samples      = "config"
unit         = ["tests", "--ignore=tests/e2e"]
e2e          = ["tests/e2e", "--e2e-autoboot"]
views        = ["/"]

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; first match wins. Unmatched paths fall
# through to `full` by design — see the doc before narrowing this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
junit_xml             = ".pytest_cache/e2e-junit.xml"

[[e2e.rule]]              # inert assets under the webapp static tree -> static
tier       = "static"
prefix     = "app/webapp/static/"
extensions = ["svg", "png", "jpg", "ico", "woff2", "webmanifest"]

[[e2e.rule]]             # vendored component READMEs are docs, never served -> none (#216)
tier       = "none"
prefix     = "app/webapp/static/_vendored/"
extensions = ["md"]

[[e2e.rule]]             # the webapp (routers + static css/js/html) -> full
tier   = "full"
prefix = "app/webapp/"

[[e2e.rule]]             # the webapp manager takes its cross-process lock from here -> full
tier = "full"
path = "app/tray/single_instance.py"

[[e2e.rule]]             # tray/gui, cli, and shared logic -> no browser impact -> none
tier       = "none"
prefix     = "app/tray/"
extensions = ["py"]

[[e2e.rule]]             # cli entry points -> no browser impact -> none
tier       = "none"
prefix     = "app/cli/"
extensions = ["py"]

[[e2e.rule]]             # shared logic layer -> no browser impact -> none
tier       = "none"
prefix     = "src/"
extensions = ["py"]

[[e2e.rule]]             # the e2e suite itself + its boot conftest -> full
tier       = "full"
prefix     = "tests/e2e/"

[[e2e.rule]]             # unit/integration tests (not the e2e suite itself) -> none
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

[[e2e.rule]]             # recorded data the installer unit tests read -> none
tier       = "none"
prefix     = "tests/install/"
extensions = ["json"]

[[e2e.rule]]             # tooling scripts (incl. this classifier) -> none
tier       = "none"
prefix     = "scripts/"

[[e2e.rule]]             # docs -> none
tier       = "none"
prefix     = "docs/"

[[e2e.rule]]             # markdown anywhere -> none
tier       = "none"
extensions = ["md"]

[[e2e.rule]]             # this file itself -> none
tier = "none"
path = ".fleet.toml"

# Launchers and repo-hygiene files never reach the browser suite (#211): the
# e2e conftest spawns `python -m app.webapp.serve` itself and
# never runs a .bat. Kept below the `app/webapp/` and `tests/e2e/` rules so a
# .bat under either still routes full. `config/webapp_config.sample.json`
# (seeded into the e2e run) and `.github/workflows/e2e.yml` (defines it) stay
# unmatched on purpose -> full.
[[e2e.rule]]             # launcher scripts (tray.bat, webapp.bat, ...) -> none
tier       = "none"
extensions = ["bat"]

[[e2e.rule]]             # git ignore list -> none
tier = "none"
path = ".gitignore"

[[e2e.rule]]             # static-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/static.json"

[[e2e.rule]]             # docs-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/docs.json"

[[e2e.rule]]             # structure-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/structure.json"

[[e2e.rule]]             # conventions-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/conventions.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/runtime-write.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/usage-track.json"

[[e2e.rule]]             # ux-surface-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/ux-surface.json"

[[e2e.rule]]             # request-budget-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/request-budget.json"

[[e2e.rule]]             # comment-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/comment.json"

[[e2e.rule]]             # instruction-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/instruction.json"

[[e2e.rule]]             # doc-refs-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/doc-refs.json"

[[e2e.rule]]             # dead-code-ratchet baseline: read by the gate only, never the browser -> none
tier = "none"
path = ".ratchets/dead-code.json"

[[e2e.rule]]             # sample config the e2e run never reads -> none
tier = "none"
path = "config/disfluencies.sample.json"

# /design-review (fleet-config skills/design-review). The app stamps html[data-theme]
# at load from voice-transcriber.theme (else the OS scheme), so the e2e capture hook
# (tests/e2e/_surface.py) has to set that key too or its dark shots stay light (#297).
[design.review]
theme_storage_key = "voice-transcriber.theme"

# The throwaway instance `measure --e2e` walks: the e2e suite's own disposable
# webapp on a free loopback port with every runtime-data path in a temp dir, never
# the live tray on :8443 (#297).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 90

# `measure --e2e` runs the suite with the surface() hook armed. A bare run would meet
# the live-tray guard (it refuses while :8443 is occupied), so autoboot is explicit.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e", "--e2e-autoboot", "-q"]
timeout_s = 900

# /perf-review (fleet-config skills/perf-review). "Ready" is the Record head line
# showing: it is filled from /api/config's language list, so it is visible only
# once boot data has landed, unlike the record button that paints with the shell.
[perf.review]
ready_selector = "#recordHeadLine"

# The browser recorder's take lifecycle (idle, starting, recording, finishing): the one
# module that owns the states and the legal moves between them. See docs/take-lifecycle.md
# and project-scaffolding docs/implicit-state-machines.md. `isTake` is the reader's way in;
# the machine has no derive function because its state is stored, not inferred.
[[state_machines]]
name   = "take"
module = "app/webapp/static/take.js"
type   = "TAKE_STATES"

# [request_budget] -- what the runtime check (tests/e2e/budget/_request_budget.py, run by
# tests/e2e/test_request_budget.py) lets the main page read in one visible minute. Measured at
# 8-9 requests (the load-time reads, the usage-log flush and the Services status poll); 10
# leaves one tick of timing jitter and still trips on a second poll or a faster cadence.
# Rules and why: project-scaffolding docs/polling-budget.md.
[request_budget]
visible_requests_per_minute = 10
