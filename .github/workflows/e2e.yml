# Pre-ship gate on CI (issue #39).
#
# Runs the exact same gate as the local `scripts/verify-before-ship.ps1` so the
# checks run without relying on the developer remembering. The local gate stays
# the contract — this workflow is supplementary.
#
# windows-latest is mandatory: this is a Windows tray app (whisper.cpp, win-only
# audio capture) and `verify-before-ship.ps1` hard-requires
# `.venv\Scripts\python.exe`, so the workflow creates `.venv` and installs into
# it — the script is untouched.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-before-ship:
    # Pinned explicitly: `windows-latest` is being redirected to windows-2025
    # by GitHub, and this is a Windows-only app whose runner shouldn't drift
    # under us. Action majors are on Node 24 (the Node 20 ones are deprecated).
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Create .venv and install deps
        # Test deps are opt-in here, split out of runtime deps — both files
        # must be installed (requirements-dev.txt carries pytest +
        # pytest-playwright). This differs from app-launcher's single file.
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: .\.venv\Scripts\python.exe -m playwright install chromium webkit

      - name: Seed webapp config from committed sample
        # webapp_config.json is gitignored — only webapp_config.sample.json is
        # checked in. Without the real file the e2e `webapp_config` fixture
        # skips, cascading through `auth_token` and silently skipping the whole
        # authed suite (tests/e2e/conftest.py). Loopback bypasses the bearer
        # middleware, so the sample token is sufficient. config.json is tracked,
        # so it needs no seeding.
        run: Copy-Item config/webapp_config.sample.json config/webapp_config.json

      - name: Run pre-ship gate
        run: pwsh -File scripts/verify-before-ship.ps1

      - name: Upload e2e diagnostic log
        # Runs even when the gate fails — the autoboot webapp output makes any
        # future e2e failure diagnosable from the run page without a local repro.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: webapp/e2e-autoboot-webapp.log
          if-no-files-found: warn
          retention-days: 7
